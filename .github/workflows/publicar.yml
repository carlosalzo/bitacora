name: Publicar y actualizar cotización

on:
  push:
    branches: [main]
  schedule:
    - cron: "40 20 * * 1-5"   # 17:40 en Argentina, después del cierre
    - cron: "15 14 * * 1-5"   # 11:15 en Argentina, por si el banco ya publicó la del día
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Leer cotización BNA divisa
        if: github.event_name != 'push'
        run: python3 scripts/cotizacion_bna.py

      - name: Guardar cotización
        if: github.event_name != 'push'
        run: |
          if git diff --quiet -- cotiz.json; then echo "Sin cambios"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cotiz.json
          git commit -m "Cotización BNA $(python3 -c 'import json;print(json.load(open("cotiz.json"))["ultima"]["fecha"])')"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
