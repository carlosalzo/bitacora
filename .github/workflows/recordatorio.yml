name: Recordatorio diario

on:
  schedule:
    - cron: "47 * * * *"   # cada hora; cada dispositivo recibe el aviso a la hora que eligió
  workflow_dispatch:
    inputs:
      forzar:
        description: "Mandar ya a todos (prueba)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: pip install --quiet google-auth requests
      - name: Mandar recordatorio
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FORZAR: ${{ github.event.inputs.forzar }}
        run: python3 scripts/recordatorio.py
