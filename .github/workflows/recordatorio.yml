name: Recordatorio diario

on:
  schedule:
    - cron: "45 23 * * *"   # 20:45 en Argentina: GitHub suele demorar unos minutos, llega cerca de las 21
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: pip install --quiet google-auth requests
      - name: Mandar recordatorio
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python3 scripts/recordatorio.py
