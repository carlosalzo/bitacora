      <div id="f-fest-box" hidden><label class="flabel" for="f-fest">¿Cuándo esperás cobrarlo? (opcional)</label><input class="field" type="date" id="f-fest" value="${st.fechaEst||""}"></div>
    </div>
    <span class="flabel" id="lbl-cat"></span>
    <div class="chips" id="f-cats"></div>
    <div id="f-pago-box">
      <span class="flabel" id="lbl-pago">Cómo pagaste</span>
      <div class="medios" id="f-medios"></div>
      <div id="f-fondo-box"><span class="flabel" id="lbl-fondo">Desde</span><div class="chips" id="f-fondos"></div></div>
      <div id="f-cred-box">
        <span class="flabel">Tarjeta</span><div class="chips" id="f-tarjs"></div>
        <span class="flabel">Cuotas</span><div class="chips" id="f-cuotas"></div>
        <p class="hint" id="f-cuota-hint"></p>
      </div>
    </div>
    ${esCuota?`<p class="hint">Cuota ${st.cuota} de una compra con ${esc(tarjNombre(st.tarjeta))}.</p>`:""}
    <div id="f-clase-box">
      <span class="flabel">Este gasto es</span>
      <div class="clases" id="f-clases">${CLASES.map(([c,col])=>`<button type="button" data-clase="${esc(c)}"><i style="background:${col}"></i>${esc(c)}</button>`).join("")}</div>
    </div>
    <div class="grid2" style="margin-top:14px">
      <div><label class="flabel" for="f-fecha" style="margin-top:0" id="lbl-fecha">Fecha</label><input class="field" type="date" id="f-fecha" value="${st.fecha}"></div>
      <div><label class="flabel" for="f-nota" style="margin-top:0">Nota (opcional)</label><input class="field" id="f-nota" maxlength="80" value="${esc(st.nota||"")}" placeholder="Ej: YPF ruta 35"></div>
    </div>
    <div class="err" id="f-err"></div>
    <div class="actions">${editing?`<button type="button" class="ghost danger" id="f-del">Borrar</button>`:""}<button type="button" class="primary" id="f-save">Guardar</button></div>`,
  sh=>{
    const $=q=>sh.querySelector(q);
    const cats=$("#f-cats"), lbl=$("#lbl-cat"), err=$("#f-err"), inp=$("#f-monto"), tcIn=$("#f-tc"), pend=$("#f-pend"), fecha=$("#f-fecha");
    const esPend=()=> st.tipo==="ingreso" && pend.checked;
    const esCred=()=> st.tipo==="gasto" && st.medio==="credito" && !esCuota;
    const tcHidden=()=> st.moneda!=="USD" || esPend() || esCred();
    if(compra) $("#f-tipos").hidden=true;
    const paintMoneda=()=>{
      $("#f-cur").textContent = st.moneda==="USD" ? "US$" : "$";
      $("#f-tc-box").hidden = tcHidden();
      if(st.moneda==="USD" && !tcTocado){
        const r=rateInfo(fecha.value||todayISO());
        if(r){ tcIn.value=String(r.v).replace(".",","); }
        else{ const u=lastUsedTc(); if(u) tcIn.value=String(u).replace(".",","); }
      }
      paintTcHint(); paintCuotaHint();
    };
    const paintTcHint=()=>{
      if(st.moneda!=="USD") return;
      const tc=parseMonto(tcIn.value), m=parseMonto(inp.value);
      const r=rateInfo(fecha.value||todayISO());
      let t = tcTocado ? "Cotización cargada a mano." : r ? "Dólar MEP del "+fechaCorta(r.fecha)+"." : lastUsedTc() ? "La última que usaste. Todavía no hay cotización MEP cargada." : "Cargá la cotización del día.";
      if(tc>0 && m>0) t+=" Equivale a "+money(m*tc)+".";
      $("#f-tc-hint").textContent=t;
    };
    const paintPend=()=>{
      $("#f-pend-box").hidden = st.tipo!=="ingreso";
      $("#f-fest-box").hidden = !esPend();
      $("#lbl-fecha").textContent = esPend() ? "Fecha del trabajo" : esCred() ? "Fecha de compra" : "Fecha";
      $("#f-tc-box").hidden = tcHidden();
    };
    /* Medio de pago, billetera y tarjeta */
    const paintPago=()=>{
      const g=st.tipo==="gasto", fids=fondoIds();
      $("#f-pago-box").hidden = esCuota;
      const lista = g ? MEDIOS : MEDIOS_ING;
      $("#f-medios").className = "medios"+(g?"":" dos");
      $("#f-medios").innerHTML = lista.map(([k,l])=>`<button type="button" data-medio="${k}" aria-pressed="${st.medio===k}">${svgIco(k==="transferencia"?"transfer":k)}${l}</button>`).join("");
      $("#lbl-pago").textContent = g ? "Cómo pagaste" : esPend() ? "Cómo lo vas a cobrar" : "Cómo lo cobraste";
      let opts=[], key=g?st.medio:"ing-"+st.medio;
      if(st.medio==="efectivo") opts=fids.filter(id=>fondoTipo(id)==="efectivo");
      else if(st.medio==="transferencia"||st.medio==="debito") opts=fids.filter(id=>fondoTipo(id)==="billetera");
      if(fondoSel===undefined || (fondoSel && !opts.includes(fondoSel))) fondoSel = defaultFondo(st.medio==="efectivo"?"efectivo":key,opts);
      const showF = opts.length>0 && !(st.medio==="efectivo" && opts.length===1);
      $("#f-fondo-box").hidden=!showF;
      $("#lbl-fondo").textContent = g ? "Desde" : "A dónde fue";
      if(showF){
        const none = st.medio==="efectivo" ? "Otro" : "Cuenta bancaria";
        $("#f-fondos").innerHTML = opts.map(id=>`<button type="button" data-fondo="${esc(id)}" aria-pressed="${fondoSel===id}">${esc(fondoNombre(id))}</button>`).join("")+`<button type="button" data-fondo="" aria-pressed="${!fondoSel}">${none}</button>`;
      }
      $("#f-cred-box").hidden = !esCred();
      if(esCred()) paintCred();
      paintPend(); $("#f-tc-box").hidden = tcHidden();
    };
    const paintCred=()=>{
      const tids=tarjIds();
      if(!st.tarjeta || !tids.includes(st.tarjeta)){ const l=lsGet("tarjeta"); st.tarjeta = tids.includes(l) ? l : (tids[0]||null); }
      if(addingTarj || !tids.length){
        $("#f-tarjs").innerHTML=`<div class="tarjnew">
          <input class="field" id="t-nom" maxlength="24" placeholder="Nombre, ej: Visa Galicia" aria-label="Nombre de la tarjeta">
          <div class="grid2"><div><label class="flabel" for="t-cierre">Día de cierre</label><input class="field num" id="t-cierre" inputmode="numeric" placeholder="Opcional"></div>
          <div><label class="flabel" for="t-vto">Día de vencimiento</label><input class="field num" id="t-vto" inputmode="numeric" placeholder="Opcional"></div></div>
          <div class="actions" style="margin-top:10px"><button type="button" class="primary" id="t-ok" style="padding:11px">Agregar tarjeta</button>${tids.length?`<button type="button" class="ghost" id="t-x" style="padding:11px 14px">Cancelar</button>`:""}</div></div>`;
        $("#t-ok").addEventListener("click",async()=>{
          const n=$("#t-nom").value.trim().replace(/\s+/g," ");
          if(!n){ err.textContent="Poné el nombre de la tarjeta."; $("#t-nom").focus(); return; }
          const ci=parseInt($("#t-cierre").value)||null, vt=parseInt($("#t-vto").value)||null;
          if((ci&&(ci<1||ci>31))||(vt&&(vt<1||vt>31))){ err.textContent="Los días van del 1 al 31."; return; }
          const id="t"+Date.now().toString(36);
          S.cfg.tarjetas={...(S.cfg.tarjetas||{}),[id]:{nombre:n,cierre:ci,vto:vt}};
          await saveCfg(); st.tarjeta=id; addingTarj=false; err.textContent=""; paintCred(); toast("Tarjeta agregada");
        });
        const x=$("#t-x"); x&&x.addEventListener("click",()=>{ addingTarj=false; paintCred(); });
      }else{
        $("#f-tarjs").innerHTML = tids.map(id=>`<button type="button" data-tarj="${esc(id)}" aria-pressed="${st.tarjeta===id}">${esc(tarjNombre(id))}</button>`).join("")+`<button type="button" class="addchip" id="t-add">+ Nueva tarjeta</button>`;
        $("#t-add").addEventListener("click",()=>{ addingTarj=true; paintCred(); });
      }
      const STD=[1,3,6,12,18], otra=!STD.includes(st.cuotas);
      $("#f-cuotas").innerHTML = STD.map(n=>`<button type="button" data-cuotas="${n}" aria-pressed="${st.cuotas===n}">${n===1?"1 pago":n}</button>`).join("")
        + `<input class="field num cuota-otra${otra?" on":""}" id="f-cuotas-otra" inputmode="numeric" placeholder="Otra" aria-label="Otra cantidad de cuotas" value="${otra?st.cuotas:""}">`;
      $("#f-cuotas-otra").addEventListener("input",e=>{ const n=parseInt(e.target.value); if(n>0&&n<=60){ st.cuotas=n; sh.querySelectorAll("[data-cuotas]").forEach(b=>b.setAttribute("aria-pressed",false)); e.target.classList.add("on"); paintCuotaHint(); } });
      paintCuotaHint();
    };
    const paintCuotaHint=()=>{
      if(!esCred()) return;
      const total=parseMonto(inp.value), n=st.cuotas||1, h=$("#f-cuota-hint");
      if(!st.tarjeta){ h.textContent=""; return; }
      const fs=cuotaFechas({fecha:fecha.value||todayISO(),tarjeta:st.tarjeta,cuotas:n});
      const t=(S.cfg.tarjetas||{})[st.tarjeta]||{};
      const fm = v => st.moneda==="USD" ? usd(v) : money(v);
      let txt = total>0 ? (n>1 ? n+" cuotas de "+fm(cuotaMonto({total,cuotas:n},1))+". " : "Un pago de "+fm(total)+". ") : "";
      txt += (n>1?"La primera vence":"Vence")+" el "+fechaCorta(fs[0])+(t.cierre&&t.vto?".":" (aproximado: cargá cierre y vencimiento en la tarjeta para que sea exacto).");
      txt += " Se suma a tus gastos cuando confirmes el resumen.";
      h.textContent=txt;
    };
    const paintCats=()=>{
      if(adding){
        cats.innerHTML=`<div class="addrow"><input class="field" id="f-newcat" maxlength="24" placeholder="${st.tipo==="gasto"?"Nombre de la categoría":"Nombre del trabajo"}" aria-label="Nueva categoría"><button type="button" id="f-newok">Agregar</button><button type="button" id="f-newx" style="background:var(--chip);color:var(--ink)" aria-label="Cancelar">✕</button></div>`;
        const i=cats.querySelector("#f-newcat"); setTimeout(()=>i.focus(),30);
        i.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); addCat(); } });
        cats.querySelector("#f-newok").addEventListener("click",addCat);
        cats.querySelector("#f-newx").addEventListener("click",()=>{ adding=false; paintCats(); });
        return;
      }
      const list=catList(st.tipo);
      if(st.cat && !list.includes(st.cat)) list.unshift(st.cat);
      cats.innerHTML = list.map(c=>{ const ic=catIco(c); return `<button type="button"${ic?' class="ic"':""} data-chip="${esc(c)}" aria-pressed="${c===st.cat}">${ic}${esc(c)}</button>`; }).join("") + `<button type="button" class="addchip" id="f-add">+ ${st.tipo==="gasto"?"Agregar categoría":"Agregar trabajo"}</button>`;
      cats.querySelector("#f-add").addEventListener("click",()=>{ adding=true; paintCats(); });
    };
    const addCat=async()=>{
      const name=(cats.querySelector("#f-newcat").value||"").trim().replace(/\s+/g," ");
      if(!name){ err.textContent="Escribí un nombre."; return; }
      const all = st.tipo==="gasto" ? gastoCats() : S.cfg.trabajos;
      const ya = all.find(c=>c.toLowerCase()===name.toLowerCase());
      if(!ya){
        if(st.tipo==="gasto"){ if(Array.isArray(S.cfg.catsGasto)) S.cfg.catsGasto=[...S.cfg.catsGasto,name]; else S.cfg.catsExtra=[...(S.cfg.catsExtra||[]),name]; }
        else S.cfg.trabajos=[...S.cfg.trabajos,name];
        await saveCfg();
      }
      st.cat = ya || name; adding=false; err.textContent=""; paintCats();
      toast(ya ? "Ya existía, la seleccioné" : (st.tipo==="gasto"?"Categoría agregada":"Trabajo agregado"));
    };
    const paintClase=()=>sh.querySelectorAll("[data-clase]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.clase===st.clase));
    const paint=()=>{
      sh.querySelectorAll("[data-tipo]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.tipo===st.tipo));
      lbl.textContent = st.tipo==="gasto" ? "Categoría" : "Trabajo";
      $("#f-clase-box").hidden = st.tipo!=="gasto";
      paintCats(); paintClase(); paintPago(); paintMoneda();
    };
    paint(); wireChips(cats,c=>st.cat=c);
    $("#f-medios").addEventListener("click",e=>{ const b=e.target.closest("[data-medio]"); if(!b) return; st.medio=b.dataset.medio; fondoSel=undefined; err.textContent=""; paintPago(); paintMoneda(); });
    $("#f-fondos").addEventListener("click",e=>{ const b=e.target.closest("[data-fondo]"); if(!b) return; fondoSel=b.dataset.fondo||null; sh.querySelectorAll("[data-fondo]").forEach(x=>x.setAttribute("aria-pressed",x===b)); });
    $("#f-tarjs").addEventListener("click",e=>{ const b=e.target.closest("[data-tarj]"); if(!b) return; st.tarjeta=b.dataset.tarj; sh.querySelectorAll("[data-tarj]").forEach(x=>x.setAttribute("aria-pressed",x===b)); paintCuotaHint(); });
    $("#f-cuotas").addEventListener("click",e=>{ const b=e.target.closest("[data-cuotas]"); if(!b) return; st.cuotas=Number(b.dataset.cuotas); const o=$("#f-cuotas-otra"); o.value=""; o.classList.remove("on"); sh.querySelectorAll("[data-cuotas]").forEach(x=>x.setAttribute("aria-pressed",x===b)); paintCuotaHint(); });
    $("#f-cur").addEventListener("click",()=>{ st.moneda = st.moneda==="USD"?"ARS":"USD"; paintMoneda(); inp.focus(); });
    tcIn.addEventListener("input",()=>{ tcTocado=true; paintTcHint(); });
    inp.addEventListener("input",()=>{ paintTcHint(); paintCuotaHint(); });
    fecha.addEventListener("change",()=>{ paintMoneda(); });
    pend.addEventListener("change",()=>{ paintPago(); paintMoneda(); });
    $("#f-clases").addEventListener("click",e=>{ const b=e.target.closest("[data-clase]"); if(!b) return; st.clase = st.clase===b.dataset.clase ? null : b.dataset.clase; paintClase(); });
    $("#f-tipos").addEventListener("click",e=>{ const b=e.target.closest("[data-tipo]"); if(!b||b.dataset.tipo===st.tipo) return; st.tipo=b.dataset.tipo; st.cat=null; adding=false; fondoSel=undefined; st.medio = st.tipo==="gasto" ? null : (lsGet("medio-ing")||"transferencia"); paint(); });
    if(!editing) setTimeout(()=>inp.focus(),60);
    $("#f-save").addEventListener("click",async()=>{
      const monto=parseMonto(inp.value);
      if(!(monto>0)){ err.textContent="Ingresá un monto mayor a cero."; inp.focus(); return; }
      if(!st.cat){ err.textContent= st.tipo==="gasto"?"Elegí una categoría.":"Elegí de qué trabajo viene."; return; }
      const falta=(el,msg)=>{ err.textContent=msg; el.classList.remove("need"); void el.offsetWidth; el.classList.add("need"); el.scrollIntoView({block:"center",behavior:"smooth"}); };
      if(st.tipo==="gasto" && !esCuota && !st.medio){ falta($("#f-medios"),"Elegí cómo pagaste."); return; }
      if(st.tipo==="ingreso" && !st.medio){ falta($("#f-medios"),"Elegí cómo lo cobraste."); return; }
      if(st.tipo==="gasto" && !st.clase){ falta($("#f-clases"),"Elegí si el gasto es Esencial, Innecesario, Inversión o Un gusto."); return; }
      const f=fecha.value||todayISO();
      const nota=$("#f-nota").value.trim();
      /* Compra con tarjeta de crédito: se guarda como compra y cada cuota se confirma al vencer */
      if(esCred()){
        if(!st.tarjeta){ err.textContent="Elegí o agregá una tarjeta."; return; }
        const n=Math.max(1,Math.min(60,parseInt(st.cuotas)||1));
        const c={id:st.id,fecha:f,cat:st.cat,nota,total:monto,moneda:st.moneda==="USD"?"USD":"ARS",tarjeta:st.tarjeta,cuotas:n,creado:st.creado||Date.now(),confirmadas:(compra&&compra.confirmadas)||[]};
        if(st.clase) c.clase=st.clase;
        try{
          if(mov) await del("movs",mov.id);
          await put("compras",c); lsSet("medio","credito"); lsSet("tarjeta",st.tarjeta);
          closeSheet(); S.month=f.slice(0,7); render(); toast(n>1?"Compra en "+n+" cuotas guardada":"Compra con tarjeta guardada");
        }catch(e){}
        return;
      }
      const obj={id:st.id,tipo:st.tipo,fecha:f,cat:st.cat,nota,creado:st.creado||Date.now()};
      if(st.moneda==="USD"){
        obj.moneda="USD"; obj.montoOrig=monto;
        if(esPend()){ obj.monto=monto*(latestRate()||lastUsedTc()||0); }
        else{
          const tc=parseMonto(tcIn.value);
          if(!(tc>0)){ err.textContent="Ingresá la cotización del dólar."; tcIn.focus(); return; }
          obj.tc=tc; obj.monto=Math.round(monto*tc*100)/100;
        }
      }else obj.monto=monto;
      if(esPend()){ obj.estado="pendiente"; const fe=$("#f-fest").value; if(fe) obj.fechaEst=fe; }
      if(st.tipo==="gasto" && st.clase) obj.clase=st.clase;
      if(st.servId) obj.servId=st.servId;
      if(st.fechaTrabajo) obj.fechaTrabajo=st.fechaTrabajo;
      if(st.cobradoTs) obj.cobradoTs=st.cobradoTs;
      if(esCuota){ ["compraId","cuota","tarjeta","medio"].forEach(k=>{ if(st[k]!=null) obj[k]=st[k]; }); }
      else if(st.medio){ obj.medio=st.medio; }
      if(!esCuota && !$("#f-pago-box").hidden){
        if(st.medio==="efectivo" && $("#f-fondo-box").hidden){ const ef=fondoIds().filter(id=>fondoTipo(id)==="efectivo"); if(ef.length===1) fondoSel=ef[0]; }
        if(fondoSel && (st.tipo==="ingreso" || st.medio!=="credito")) obj.fondo=fondoSel;
        lsSet("fondo-"+(st.tipo==="gasto"||st.medio==="efectivo"?st.medio:"ing-"+st.medio), fondoSel||"");
      }
      if(st.medio) lsSet(st.tipo==="gasto"?"medio":"medio-ing", st.medio);
      try{
        if(compra) await del("compras",compra.id);
        await put("movs",obj); closeSheet(); S.month=f.slice(0,7); render(); toast(esPend()?"Guardado como pendiente de cobro":st.tipo==="gasto"?"Gasto guardado":"Ingreso guardado");
      }catch(e){}
    });
    if(editing) wireDelete($("#f-del"),async()=>{ try{ if(compra) await del("compras",compra.id); else await del("movs",st.id); closeSheet(); toast(compra?"Compra borrada":"Movimiento borrado"); }catch(e){} });
  });
}

/* Pasar un pendiente a cobrado */
async function cobrar(m){
  if(m.moneda==="USD") return sheetCobro(m);
  const obj={...m}; delete obj.estado; delete obj.fechaEst;
  obj.fechaTrabajo=m.fecha; obj.fecha=todayISO(); obj.cobradoTs=Date.now();
  try{ await put("movs",obj); S.month=obj.fecha.slice(0,7); render(); toast("Marcado como cobrado hoy"); }catch(e){}
}
function sheetCobro(m){
  const hoy=todayISO();
  openSheet(`<h4>Cobrado</h4>
    <p class="hint" style="margin-top:-6px">${esc(m.cat)}${m.nota?" · "+esc(m.nota):""}</p>
    <div class="amount"><span class="cur" style="cursor:default">US$</span><input id="c-monto" inputmode="decimal" aria-label="Monto cobrado en dólares" value="${esc(String(m.montoOrig).replace(".",","))}"></div>
    <div class="grid2">
      <div><label class="flabel" for="c-fecha" style="margin-top:0">Fecha de cobro</label><input class="field" type="date" id="c-fecha" value="${hoy}"></div>
      <div><label class="flabel" for="c-tc" style="margin-top:0">Cotización</label><input class="field num" id="c-tc" inputmode="decimal"></div>
    </div>
    <p class="hint" id="c-hint"></p>
    <div class="err" id="c-err"></div>
    <div class="actions"><button type="button" class="primary" id="c-ok">Confirmar cobro</button></div>`,
  sh=>{
    const $=q=>sh.querySelector(q); let tocado=false;
    const fill=()=>{ if(!tocado){ const r=rateInfo($("#c-fecha").value||hoy); const v=r?r.v:lastUsedTc(); $("#c-tc").value=v?String(v).replace(".",","):""; } hint(); };
    const hint=()=>{ const r=rateInfo($("#c-fecha").value||hoy), tc=parseMonto($("#c-tc").value), u=parseMonto($("#c-monto").value);
      $("#c-hint").textContent=(tocado?"Cotización cargada a mano.":r?"Dólar MEP del "+fechaCorta(r.fecha)+".":"Cargá la cotización del día.")+(tc>0&&u>0?" Equivale a "+money(u*tc)+".":""); };
    fill();
    $("#c-fecha").addEventListener("change",fill);
    $("#c-tc").addEventListener("input",()=>{ tocado=true; hint(); });
    $("#c-monto").addEventListener("input",hint);
    $("#c-ok").addEventListener("click",async()=>{
      const u=parseMonto($("#c-monto").value), tc=parseMonto($("#c-tc").value);
      if(!(u>0)){ $("#c-err").textContent="Ingresá el monto cobrado."; return; }
      if(!(tc>0)){ $("#c-err").textContent="Ingresá la cotización."; return; }
      const obj={...m}; delete obj.estado; delete obj.fechaEst;
      obj.fechaTrabajo=m.fecha; obj.fecha=$("#c-fecha").value||hoy; obj.montoOrig=u; obj.tc=tc; obj.monto=Math.round(u*tc*100)/100; obj.cobradoTs=Date.now();
      try{ await put("movs",obj); closeSheet(); S.month=obj.fecha.slice(0,7); render(); toast("Marcado como cobrado"); }catch(e){}
    });
  });
}

function sheetServ(serv,vehDefault){
  const editing=!!serv;
  const st = serv ? {...serv} : {id:uid(), veh:vehDefault||vehIds()[0], fecha:todayISO(), km:null, tipos:[], detalle:"", costo:null, proxKm:null, proxFecha:null};
  const linked = st.movId ? S.movs.find(m=>m.id===st.movId) : null;
  st.tipos=[...servTipos(st)];
  let tiposLista=[...new Set([...SERV_TIPOS,...(S.cfg.servTiposExtra||[]),...st.tipos])], addingT=false;
  const vn=v=>esc(vehNombre(v));
  const vids=vehIds(); if(st.veh && !vids.includes(st.veh)) vids.push(st.veh);
  openSheet(`
    <h4>${editing?"Editar service":"Registrar service"}</h4>
    <div class="vseg" id="s-vehs">${vids.map(v=>`<button type="button" data-veh="${esc(v)}">${vn(v)}</button>`).join("")}</div>
    <div class="grid2">
      <div><label class="flabel" for="s-fecha" style="margin-top:0">Fecha</label><input class="field" type="date" id="s-fecha" value="${st.fecha}"></div>
      <div><label class="flabel" for="s-km" style="margin-top:0">Kilómetros</label><input class="field num" id="s-km" inputmode="numeric" placeholder="" value="${st.km?km(st.km):""}"></div>
    </div>
    <span class="flabel">Qué se hizo <span class="flabel-note">podés marcar varias</span></span>
    <div class="chips pick" id="s-tipos"></div>
    <label class="flabel" for="s-det">Detalle del service</label>
    <textarea class="field" id="s-det" maxlength="400" placeholder="Ej: aceite 10W40 sintético, filtro de aceite y de aire. Taller de Pico.">${esc(st.detalle||"")}</textarea>
    <span class="flabel">Próximo service</span>
    <div class="grid2">
      <div><input class="field num" id="s-pkm" inputmode="numeric" aria-label="Próximo service, kilómetros" placeholder="A los … km" value="${st.proxKm?km(st.proxKm):""}">
        <div class="quick" id="q-km"><button type="button" data-add="3000">+3.000</button><button type="button" data-add="5000">+5.000</button><button type="button" data-add="10000">+10.000</button></div></div>
      <div><input class="field" type="date" id="s-pfecha" aria-label="Próximo service, fecha" value="${st.proxFecha||""}">
        <div class="quick" id="q-f"><button type="button" data-m="6">+6 meses</button><button type="button" data-m="12">+1 año</button></div></div>
    </div>
    <label class="flabel" for="s-costo">Costo (opcional)</label>
    <label class="amount" style="margin-bottom:0"><span>$</span><input id="s-costo" inputmode="decimal" placeholder="0" style="font-size:32px" value="${st.costo?esc(String(st.costo).replace(".",",")):""}"></label>
    <label class="check"><input type="checkbox" id="s-asgasto" ${(!editing||linked)?"checked":""}> Sumarlo a mis gastos (categoría Vehículo)</label>
    <div class="err" id="s-err"></div>
    <div class="actions">${editing?`<button type="button" class="ghost danger" id="s-del">Borrar</button>`:""}<button type="button" class="primary" id="s-save">Guardar</button></div>`,
  sh=>{
    const paintVeh=()=>sh.querySelectorAll("[data-veh]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.veh===st.veh));
    paintVeh();
    sh.querySelector("#s-vehs").addEventListener("click",e=>{ const b=e.target.closest("[data-veh]"); if(b){ st.veh=b.dataset.veh; paintVeh(); }});
    const box=sh.querySelector("#s-tipos");
    const paintTipos=()=>{
      box.innerHTML=tiposLista.map(t=>{ const on=st.tipos.includes(t); return `<button type="button" data-chip="${esc(t)}" aria-pressed="${on}">${on?"✓ ":""}${esc(t)}</button>`; }).join("")
        + (addingT ? `<div class="addrow"><input class="field" id="s-newt" maxlength="30" placeholder="Ej: Bujías, Embrague, Alineación" aria-label="Nueva etiqueta"><button type="button" id="s-newok">Agregar</button><button type="button" id="s-newx" style="background:var(--chip);color:var(--ink)" aria-label="Cancelar">✕</button></div>`
                   : `<button type="button" class="addchip" id="s-addt">+ Agregar etiqueta</button>`);
      if(addingT){ const i=box.querySelector("#s-newt"); setTimeout(()=>i.focus(),30); i.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); addTipo(); } }); }
    };
    const addTipo=async()=>{
      const n=(box.querySelector("#s-newt").value||"").trim().replace(/\s+/g," ");
      if(!n){ sh.querySelector("#s-err").textContent="Escribí el nombre de la etiqueta."; return; }
      const ya=tiposLista.find(t=>t.toLowerCase()===n.toLowerCase());
      if(!ya){ S.cfg.servTiposExtra=[...(S.cfg.servTiposExtra||[]),n]; tiposLista=[...tiposLista,n]; await saveCfg(); }
      const t=ya||n; if(!st.tipos.includes(t)) st.tipos=[...st.tipos,t];
      addingT=false; sh.querySelector("#s-err").textContent=""; paintTipos(); toast(ya?"Ya existía, la marqué":"Etiqueta agregada");
    };
    paintTipos();
    box.addEventListener("click",e=>{
      if(e.target.closest("#s-addt")){ addingT=true; paintTipos(); return; }
      if(e.target.closest("#s-newok")){ addTipo(); return; }
      if(e.target.closest("#s-newx")){ addingT=false; paintTipos(); return; }
      const b=e.target.closest("[data-chip]"); if(!b) return; const t=b.dataset.chip; st.tipos = st.tipos.includes(t) ? st.tipos.filter(x=>x!==t) : [...st.tipos,t]; paintTipos(); });
    const kmIn=sh.querySelector("#s-km"), pkm=sh.querySelector("#s-pkm"), pf=sh.querySelector("#s-pfecha");
    if(!editing){ const c=vehKm(st.veh); kmIn.placeholder = c? "Último: "+km(c) : "Ej: 45.200"; }
    [kmIn,pkm].forEach(i=>i.addEventListener("input",()=>{ const n=parseKm(i.value); i.value=n?km(n):""; }));
    sh.querySelector("#q-km").addEventListener("click",e=>{ const b=e.target.closest("[data-add]"); if(!b) return;
      const base=parseKm(kmIn.value)||vehKm(st.veh); if(!base){ sh.querySelector("#s-err").textContent="Cargá primero los kilómetros actuales."; return; }
      pkm.value=km(base+Number(b.dataset.add)); });
    sh.querySelector("#q-f").addEventListener("click",e=>{ const b=e.target.closest("[data-m]"); if(!b) return;
      pf.value=addMonths(sh.querySelector("#s-fecha").value||todayISO(),Number(b.dataset.m)); });
    sh.querySelector("#s-save").addEventListener("click",async()=>{
      const err=sh.querySelector("#s-err");
      if(!st.tipos.length){ err.textContent="Elegí al menos una cosa que se hizo."; return; }
      const tiposOrd=tiposLista.filter(t=>st.tipos.includes(t));
      const kmv=parseKm(kmIn.value);
      const costo=parseMonto(sh.querySelector("#s-costo").value);
      const fecha=sh.querySelector("#s-fecha").value||todayISO();
      const obj={id:st.id,veh:st.veh,fecha,km:kmv||null,tipos:tiposOrd,tipo:tiposOrd[0],detalle:sh.querySelector("#s-det").value.trim(),
        costo:costo>0?costo:null,proxKm:parseKm(pkm.value)||null,proxFecha:pf.value||null,creado:st.creado||Date.now()};
      if(obj.proxKm && kmv && obj.proxKm<=kmv){ err.textContent="El próximo service tiene que ser después de los km actuales."; return; }
      const asGasto=sh.querySelector("#s-asgasto").checked;
      try{
        if(asGasto && obj.costo){
          const mid=st.movId||uid();
          obj.movId=mid;
          await put("movs",{id:mid,tipo:"gasto",fecha,monto:obj.costo,cat:"Vehículo",clase:"Esencial",nota:tiposOrd.join(", ")+" · "+vehNombre(st.veh),servId:obj.id,creado:(linked&&linked.creado)||Date.now()});
        }else if(st.movId){ await del("movs",st.movId).catch(()=>{}); }
        await put("servs",obj);
        if(kmv && S.cfg.vehiculos[st.veh] && kmv>(S.cfg.vehiculos[st.veh].km||0)){ S.cfg.vehiculos[st.veh].km=kmv; await saveCfg(); }
        closeSheet(); render(); toast("Service guardado");
      }catch(e){}
    });
    if(editing) wireDelete(sh.querySelector("#s-del"),async()=>{
      try{ if(st.movId) await del("movs",st.movId).catch(()=>{}); await del("servs",st.id); closeSheet(); toast("Service borrado"); }catch(e){}
    });
  });
}

function sheetDoc(v,k){
  const [,nom,quick]=DOCS.find(d=>d[0]===k);
  const veh=S.cfg.vehiculos[v]; const x=((veh.docs||{})[k])||{};
  openSheet(`<h4>${nom} · ${esc(veh.nombre)}</h4>
    <div class="grid2">
      <div><label class="flabel" for="d-hecho" style="margin-top:0">${k==="vtv"?"Fecha en que la hiciste":"Fecha de carga o compra"}</label><input class="field" type="date" id="d-hecho" value="${x.hecho||""}"></div>
      <div><label class="flabel" for="d-vence" style="margin-top:0">Vencimiento</label><input class="field" type="date" id="d-vence" value="${x.vence||""}">

    </div>
    <p class="hint">Te aviso en Plata 30 días antes de que venza. Los atajos calculan el vencimiento desde la fecha de realización.</p>
    <div class="err" id="d-err"></div>
    <div class="actions">${x.vence||x.hecho?`<button type="button" class="ghost danger" id="d-del">Borrar</button>`:""}<button type="button" class="primary" id="d-ok">Guardar</button></div>`,
  sh=>{
    const $=q=>sh.querySelector(q);
    $("#d-q").addEventListener("click",e=>{ const b=e.target.closest("[data-m]"); if(!b) return; $("#d-vence").value=addMonths($("#d-hecho").value||todayISO(),Number(b.dataset.m)); });
    const guardar=async docs=>{ S.cfg.vehiculos={...S.cfg.vehiculos,[v]:{...S.cfg.vehiculos[v],docs}}; await saveCfg(); };
    $("#d-ok").addEventListener("click",async()=>{
      const hecho=$("#d-hecho").value||null, vence=$("#d-vence").value||null;
      if(!vence){ $("#d-err").textContent="Poné la fecha de vencimiento."; return; }

    const d=$("#d-del"); d&&wireDelete(d,async()=>{ const docs={...(veh.docs||{})}; delete docs[k]; await guardar(docs); closeSheet(); toast(nom+" borrado"); });

function sheetKm(v){
  const cur=vehKm(v);
  openSheet(`<h4>Kilómetros de ${esc(S.cfg.vehiculos[v].nombre.toLowerCase())}</h4>
    <label class="amount"><input id="k-km" class="num" inputmode="numeric" placeholder="${cur?km(cur):"0"}" aria-label="Kilómetros actuales"><span style="font-size:24px">km</span></label>
    <p class="hint">Con el kilometraje al día, los avisos de service se calculan solos.</p>
    <div class="err" id="k-err"></div>
    <div class="actions"><button type="button" class="primary" id="k-save">Guardar</button></div>`,
  sh=>{
    const i=sh.querySelector("#k-km"); setTimeout(()=>i.focus(),60);
    i.addEventListener("input",()=>{ const n=parseKm(i.value); i.value=n?km(n):""; });
    sh.querySelector("#k-save").addEventListener("click",async()=>{
      const n=parseKm(i.value);
      if(!n){ sh.querySelector("#k-err").textContent="Ingresá los kilómetros."; return; }
      if(n<cur){ sh.querySelector("#k-err").textContent="Es menos que el último registro ("+km(cur)+" km)."; return; }
      S.cfg.vehiculos[v].km=n; await saveCfg(); closeSheet(); toast("Kilometraje actualizado");
    });
  });
}

function sheetVeh(id){
  const editing=!!id;
  const v = editing ? {...S.cfg.vehiculos[id]} : {nombre:"",tipo:null,km:0};
  if(editing && !v.tipo) v.tipo=vehTipo(id);
  const nServ = editing ? S.servs.filter(s=>s.veh===id).length : 0;
  openSheet(`<h4>${editing?"Editar vehículo":"Nuevo vehículo"}</h4>
    <span class="flabel" style="margin-top:0">Tipo</span>
    <div class="chips" id="v-tipos">${chipHtml(VEH_TIPOS,v.tipo)}</div>
    <label class="flabel" for="v-nom">Nombre</label>
    <input class="field" id="v-nom" maxlength="24" placeholder="Ej: Hilux, Gol de Maru, Tornado" value="${esc(v.nombre||"")}">
    <label class="flabel" for="v-km">Kilómetros actuales</label>
    <input class="field num" id="v-km" inputmode="numeric" placeholder="Ej: 85.000" value="${editing&&vehKm(id)?km(vehKm(id)):""}">
    ${editing?`<p class="hint">Tiene ${nServ} service${nServ===1?"":"s"} cargado${nServ===1?"":"s"}. Si lo borrás, se borra también ese historial; los gastos ya cargados quedan.</p>`:""}
    <div class="err" id="v-err"></div>
    <div class="actions">${editing?`<button type="button" class="ghost danger" id="v-del">Borrar</button>`:""}<button type="button" class="primary" id="v-save">${editing?"Guardar":"Agregar vehículo"}</button></div>`,
  sh=>{
    const $=q=>sh.querySelector(q), nom=$("#v-nom"), kmIn=$("#v-km");
    wireChips($("#v-tipos"),t=>{ v.tipo=t; if(!nom.value.trim()) nom.placeholder=t==="Moto"?"Ej: Tornado":t==="Camioneta"?"Ej: Hilux":"Ej: Gol"; });
    kmIn.addEventListener("input",()=>{ const n=parseKm(kmIn.value); kmIn.value=n?km(n):""; });
    if(!editing) setTimeout(()=>nom.focus(),60);
    $("#v-save").addEventListener("click",async()=>{
      const n=nom.value.trim().replace(/\s+/g," ");
      if(!v.tipo){ $("#v-err").textContent="Elegí el tipo de vehículo."; return; }
      if(!n){ $("#v-err").textContent="Ponele un nombre."; nom.focus(); return; }
      const dup=vehIds().find(x=>x!==id && vehNombre(x).toLowerCase()===n.toLowerCase());
      if(dup){ $("#v-err").textContent="Ya tenés un vehículo con ese nombre."; return; }
      const k=parseKm(kmIn.value)||0;
      const vid = id || ("v"+Date.now().toString(36));
      const orden = editing ? vehOrden(id) : Math.max(0,...vehIds().map(vehOrden))+1;
      S.cfg.vehiculos={...S.cfg.vehiculos,[vid]:{nombre:n,tipo:v.tipo,km:k,orden}};
      await saveCfg(); closeSheet(); toast(editing?"Vehículo actualizado":"Vehículo agregado");
    });
    if(editing) wireDelete($("#v-del"),async()=>{
      try{
        for(const s of S.servs.filter(x=>x.veh===id)) await del("servs",s.id);
        const c={...S.cfg.vehiculos}; delete c[id]; S.cfg.vehiculos=c;
        await saveCfg(); closeSheet(); toast("Vehículo borrado");
      }catch(e){}
    });
  });
}

function sheetCfg(){
  openSheet(`<h4>Ajustes</h4>
    <span class="flabel" style="margin-top:0">Categorías</span>

    <span class="flabel" style="margin-top:22px">Tarjetas de crédito</span>

    <div class="addrow" style="margin-top:8px"><input class="field num" id="c-cot" inputmode="decimal" placeholder="Ej: 1.529,50" aria-label="Cotización de hoy"><button type="button" id="c-cotok">Guardar</button></div>
    <span class="flabel" style="margin-top:22px">Tus datos</span>

    <div class="actions" style="margin-top:10px"><button type="button" class="ghost" id="c-csv-m" style="flex:1">Movimientos (CSV)</button><button type="button" class="ghost" id="c-csv-s" style="flex:1">Services (CSV)</button></div>
    <div class="actions" style="margin-top:10px"><button type="button" class="ghost" id="c-bak" style="flex:1">Descargar respaldo</button><label class="ghost filebtn" style="flex:1" for="c-imp">Importar respaldo<input type="file" id="c-imp" accept=".json,application/json" hidden></label></div>
    <div class="err" id="c-err"></div>
    <span class="flabel" style="margin-top:22px">Cuenta</span>
    <div class="actions" style="margin-top:0"><button type="button" class="ghost" id="c-out" style="flex:1">Cerrar sesión</button></div>
    <p class="hint" style="margin-top:14px">Libreta · versión 10</p>`,
  sh=>{

      const v=parseMonto(sh.querySelector("#c-cot").value);
      if(!(v>0)){ toast("Ingresá una cotización válida."); return; }
      if(await saveCotizManual(v)){ closeSheet(); toast("Cotización guardada"); }
    });
    sh.querySelector("#c-gcats").addEventListener("click",()=>sheetCats("gasto"));
    sh.querySelector("#c-tarjs").addEventListener("click",e=>{ const b=e.target.closest("[data-tj]"); if(b) sheetTarjeta(b.dataset.tj||null); });
    sh.querySelector("#c-icats").addEventListener("click",()=>sheetCats("ingreso"));
    const csv=rows=>rows.map(r=>r.map(v=>{ v=v==null?"":String(v); return /[";\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }).join(";")).join("\n");
    const save=(name,data)=>downloadFile(name,"\ufeff"+data,"text/csv;charset=utf-8").catch(()=>toast("No se pudo exportar."));
    sh.querySelector("#c-bak").addEventListener("click",()=>downloadFile("libreta-respaldo-"+todayISO()+".json",backupJson(),"application/json").catch(()=>toast("No se pudo exportar.")));
    sh.querySelector("#c-out").addEventListener("click",logout);
    sh.querySelector("#c-imp").addEventListener("change",async e=>{
      const f=e.target.files&&e.target.files[0]; if(!f) return;
      try{ const res=await importBackup(JSON.parse(await f.text())); closeSheet(); toast("Importados "+res.movs+" movimientos y "+res.servs+" services"); }
      catch(err){ sh.querySelector("#c-err").textContent="Ese archivo no es un respaldo de Libreta."; }
      e.target.value="";
    });
    const bm=sh.querySelector("#c-csv-m"), bs=sh.querySelector("#c-csv-s");

    bs && bs.addEventListener("click",()=>save("services.csv",csv([["Vehículo","Fecha","Km","Tipo","Detalle","Costo","Próximo km","Próxima fecha"],...[...S.servs].sort((a,b)=>a.fecha<b.fecha?-1:1).map(s=>[vehNombre(s.veh),s.fecha,s.km,servLabel(s),s.detalle,s.costo,s.proxKm,s.proxFecha])])));
  });
}

/* ---------- Eventos ---------- */
document.getElementById("view").addEventListener("click",e=>{
  const qb=e.target.closest("[data-q]");
  if(qb){ S.search=qb.dataset.q; render(); const q=document.getElementById("q"); q&&q.focus(); return; }
  if(S.setup){
    const pk=e.target.closest("[data-pick] [data-chip]");
    if(pk){ const id=pk.closest("[data-pick]").dataset.pick; pickToggle(S.setup[id],pk.dataset.chip); render(); return; }
    const ad=e.target.closest("[data-addpick]");
    if(ad){ const id=ad.dataset.addpick; pickAdd(S.setup[id],S.setup[id==="gasto"?"extraG":"extraI"],document.getElementById("add-"+id).value,id==="gasto"?SUG_GASTO:SUG_INGRESO); render(); return; }
  }
  const b=e.target.closest("[data-act]"); if(!b) return;
  const a=b.dataset.act;
  if(a==="login"){ login(); return; }
  if(a==="setupDone"){ setupDone(); return; }
  if(a==="retry"){ location.reload(); return; }
  if(a==="mes"){ S.month=shiftMonth(S.month,Number(b.dataset.n)); render(); }
  else if(a==="tab"){ setTab(b.dataset.tab); }
  else if(a==="nuevo"){ const t=b.dataset.tipo; sheetMov(null,null, t==="pend"?{tipo:"ingreso",estado:"pendiente"}:{tipo:t}); }
  else if(a==="qkm"){ const ids=vehIds(); if(!ids.length) sheetVeh(null); else if(ids.length===1) sheetKm(ids[0]); else setTab("vehiculos"); }
  else if(a==="filtro"){ S.filtro=b.dataset.f; render(); }
  else if(a==="buscar"){ openSearch(); }
  else if(a==="res"){ S.res=b.dataset.res; render(); }
  else if(a==="cur"){ S.cur=b.dataset.cur; render(); }
  else if(a==="ajFijos"){ sheetFijos(); }
  else if(a==="closeSearch"){ closeSearch(); }
  else if(a==="confCuotas"){ confirmarCuotas(b.dataset.key); }
  else if(a==="editCompra"){ const c=S.compras.find(x=>x.id===b.dataset.id); c&&sheetMov(null,c); }
  else if(a==="newFondo"){ sheetFondo(null); }
  else if(a==="editFondo"){ sheetFondo(b.dataset.id); }
  else if(a==="cobrar"){ const m=S.movs.find(x=>x.id===b.dataset.id); m&&cobrar(m); }
  else if(a==="editMov"){ const m=S.movs.find(x=>x.id===b.dataset.id); if(!m) return;
    if(m.servId && S.servs.some(s=>s.id===m.servId)){ sheetServ(S.servs.find(s=>s.id===m.servId)); } else sheetMov(m); }
  else if(a==="editServ"){ const s=S.servs.find(x=>x.id===b.dataset.id); s&&sheetServ(s); }
  else if(a==="newServ"){ sheetServ(null,b.dataset.v); }
  else if(a==="km"){ sheetKm(b.dataset.v); }
  else if(a==="editVeh"){ sheetVeh(b.dataset.v); }
  else if(a==="doc"){ sheetDoc(b.dataset.v,b.dataset.doc); }
});
function setTab(t){
  if(t===S.tab && S.search===null) return;
  const drop=[]; if(S.search!==null) drop.push("search");
  if(t==="plata") drop.push("tab");
  if(drop.length) dropLayers(drop);
  if(t!=="plata" && !LAYERS.includes("tab")) pushLayer("tab");
  S.tab=t; S.search=null; render(); window.scrollTo(0,0);
}
document.getElementById("tab-plata").addEventListener("click",()=>setTab("plata"));
document.getElementById("tab-movs").addEventListener("click",()=>setTab("movs"));
document.getElementById("tab-resumen").addEventListener("click",()=>setTab("resumen"));
document.getElementById("tab-vehiculos").addEventListener("click",()=>setTab("vehiculos"));
document.getElementById("fab").addEventListener("click",()=>{ if(S.tab!=="vehiculos") return sheetMov(null); if(!vehIds().length) return sheetVeh(null); sheetServ(null); });
document.getElementById("fab2").addEventListener("click",()=>sheetVeh(null));
document.getElementById("btnCfg").addEventListener("click",sheetCfg);
document.getElementById("btnSearch").addEventListener("click",()=>{ if(S.search!==null && S.tab==="movs") closeSearch(); else openSearch(); });
document.getElementById("view").addEventListener("input",e=>{
  if(e.target.id!=="q") return;
  S.search=e.target.value; document.getElementById("srch-res").innerHTML=renderSearchRes();
});
document.getElementById("view").addEventListener("keydown",e=>{
  if(!S.setup||e.key!=="Enter"||!e.target.id||!e.target.id.startsWith("add-")) return;
  e.preventDefault(); const id=e.target.id.slice(4);
  pickAdd(S.setup[id],S.setup[id==="gasto"?"extraG":"extraI"],e.target.value,id==="gasto"?SUG_GASTO:SUG_INGRESO); render();
  const i=document.getElementById(e.target.id); i&&i.focus();
});

{ const hsh=location.hash.replace("#",""); if(hsh==="vehiculos"||hsh==="resumen"||hsh==="movs") S.tab=hsh; }
render();
initStore();
if("serviceWorker" in navigator){ window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{})); }

</script>
